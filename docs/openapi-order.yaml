openapi: 3.0.3
info:
  title: Sirius order-service
  version: 0.1.0
  description: |
    Контракт, восстановленный по руководству «Сириус» (главы 5-7): CreateOrderRequest, OrderResponse,
    OrderSummary, PageResponse, ошибки application/problem+json (RFC 9457).
    Источник истины - код order-service; при расхождении правьте этот файл.
servers:
  - url: https://api.sirius.test
security:
  - bearer: [ ]
paths:
  /api/v1/orders:
    post:
      summary: Создать заказ (идемпотентно)
      description: Нужен scope orders.write. Повтор с тем же Idempotency-Key возвращает тот же заказ.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Создан
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Нет или просрочен токен }
        '403': { description: Нет scope orders.write }
    get:
      summary: Список заказов текущего пользователя
      description: Нужен scope orders.read. size ограничен 100. Сортировка по createdAt по убыванию.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Страница заказов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfOrderSummary' }
        '401': { description: Нет или просрочен токен }
        '403': { description: Нет scope orders.read }
  /api/v1/orders/{id}:
    get:
      summary: Карточка заказа
      description: Нужен scope orders.read. Чужой заказ возвращает 404 (защита от IDOR).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { description: Нет или просрочен токен }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Ошибка в формате problem+json
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CreateOrderRequest:
      type: object
      required: [currency, items]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Item' }
    Item:
      type: object
      required: [sku, name, quantity, unitPrice]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        unitPrice: { type: number, minimum: 0, description: "До 10 цифр до точки и 2 после (BigDecimal на backend)" }
    OrderResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        totalAmount: { type: number }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    OrderSummary:
      type: object
      description: Краткое представление для списка, без позиций.
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        totalAmount: { type: number }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
    PageOfOrderSummary:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
